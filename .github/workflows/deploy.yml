name: Deploy to Render

on:
  push:
    branches: [main]


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

        run: |
          # Use curl to hit the render api to trigger a deploy 
          # Passing the env vars secretly in the payload
          echo "Triggering deploy with injected secrets"
          curl --request POST \
            --url https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys\
            --header 'accept: application/json'\
            --header 'content-type: application/json'\
            --header "authorization: Bearer $RENDER_API_KEY"\
            --data '
            {
              "clearCache": "do_not_clear",
              "deployMode": "build_and_deploy"
            }
            '
