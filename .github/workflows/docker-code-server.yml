name: Build and push Code-Server

on:
  push:
    branches:
        - main
    paths:
        - 'Docker/code-server.Dockerfile'
        - 'docker-code-server.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
            

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
            context: .
            file: Docker/code-server.Dockerfile
            push: true
            tags: |
                ${{ secrets.DOCKER_USERNAME }}/bolty-code-server:latest
                ${{ secrets.DOCKER_USERNAME }}/bolty-code-server:${{ github.sha }}

            cache-from: type=registry, ref=${{ secrets.DOCKER_USERNAME }}/bolty-code-server:buildcache
            cache-to: type=registry, ref=${{ secrets.DOCKER_USERNAME }}/bolty-code-server:buildcache,mode=max