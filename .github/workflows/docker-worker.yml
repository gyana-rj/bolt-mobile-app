name: Build and Push Worker

on:
  push:
    branches:
        - main
    paths:
      - 'apps/worker/**'
      - 'packages/**'
      - 'Docker/worker.Dockerfile'
      - 'package.json'
      - 'tubo.json'
      - 'bun.lock'
      - '.github/workflows/docker-worker.yml'
  workflow_dispatch:

jobs:
 build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
            context: .
            file: Docker/worker.Dockerfile
            push: true
            tags: |
                ${{ secrets.DOCKER_USERNAME }}/bolty-worker:latest
                ${{ secrets.DOCKER_USERNAME }}/bolty-worker:${{ github.sha }}

            cache-from: type=registry, ref=${{ secrets.DOCKER_USERNAME }}/bolty-worker:buildcache
            cache-to: type=registry, ref=${{ secrets.DOCKER_USERNAME }}/bolty-worker:buildcache,mode=max