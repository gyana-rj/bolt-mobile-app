name: Build and push Frontend

on:
  push:
    branches: 
        - main
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - 'Docker/frontend.Dockerfile'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - '.github/workflows/docker-frontend.yml'
  workflow_dispatch:


jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
            context: .
            file: Docker/frontend.Dockerfile
            push: true
            tags: |
                ${{ secrets.DOCKERHUB_USERNAME}}/bolty-frontend:latest
                ${{ secrets.DOCKERHUB_USERNAME}}/bolty-frontend:${{ github.sha }}
            cache-from: type=registry, ref=${{ secrets.DOCKERHUB_USERNAME}}/bolty-frontend:buildcache
            cache-to: type=registry, ref=${{ secrets.DOCKERHUB_USERNAME}}/bolty-frontend:buildcache,mode=max
