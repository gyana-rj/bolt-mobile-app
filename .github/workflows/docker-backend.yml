name: Build & push Backend

on:
  push:
    branches:
        - main
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'Docker/backend.Dockerfile'
      - 'package.json'
      - 'turbo.json'
      - 'bun.lock'
      - '.github/workflows/docker-backend.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and push
    runs-on : ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with : 
          context: .
          file: Docker/backend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME}}/bolty-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME}}/bolty-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME}}/bolty-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME}}/bolty-backend:buildcache,mode=max