name: Build and Push Worker Orchestrator 

on:
  push:
    branches:
      - main
    paths:
      - 'apps/worker-orchestrator/**'
      - 'packages/**'
      - 'Docker/worker-orchestrator.Dockerfile'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - '.github/workflows/docker-orchestrator.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
            context: .
            file: Docker/worker-orchestrator.Dockerfile
            push: true
            tags: |
                ${{ secrets.DOCKERHUB_USERNAME}}/bolty-worker-orchestrator:latest
                ${{ secrets.DOCKERHUB_USERNAME}}/bolty-worker-orchestrator:${{ github.sha }}
            cache-from: type=registry, ref=${{ secrets.DOCKERHUB_USERNAME}}/bolty-worker-orchestrator:buildcache
            cache-to: type=registry, ref=${{ secrets.DOCKERHUB_USERNAME}}/bolty-worker-orchestrator:buildcache, mode=max
